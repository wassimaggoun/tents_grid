<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Tents Game A15</title>
    <style>
        body {text-align: center; background-color:rgb(255, 255, 255) ;
            background-attachment: fixed; background-image: url('res/bg_whole.png') }
        canvas { background-color: rgb(75, 21, 162); border: 2px solid #333}
        .controls { margin: 20px; }
        button { padding: 8px 16px ; background-color: burlywood; border-radius: 6px;}
        input {background-color: burlywood; border-radius: 6px;}
    </style>
</head>

<body>

    <!-- ********************* html ********************* -->


    <img src="res/logo.png" height="150">

    <p>Team A15 : Wassim Aggoun , Servan Arda Goksu , Zineddine Ziane</p>

    <canvas id='mycanvas' width="500px" height="500px"></canvas>

    <div class="control">
        <label>Rows: <input type="number" id="inputRows" value="8"></label>
        <label>Cols: <input type="number" id="inputCols" value="8"></label>
        <label><input type="checkbox" id="checkWrapping"> Wrapping</label>
        <button id="btnRandom">Create</button>
        <br><br>
        <button id="restart">Restart</button>
        <button id="undo">Undo</button>
        <button id="redo">Redo</button>
        <button id="solve">Solve</button>
        <button id="fillgrass">Fill Grass</button>
    </div>


    <!-- ********************* script ********************* -->

    <script src="game.js"></script>
    <script src="demo.js"> </script>

</body>

</html>
